[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-agent"
version = "0.1.0a0"
description = "Methodology-first toolkit for professional AI agent design, review, and governance."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "meta-agent contributors" }
]
keywords = ["ai-agent", "llm", "agent-framework", "human-in-the-loop", "memory", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
meta-agent = "meta_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
